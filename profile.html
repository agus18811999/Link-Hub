<!-- CUSTOM LUXURY AVATAR STYLING & ANIMATIONS -->
<style>
  /* 1. Ambient Breathing Plasma Halo */
  .avatar-luminous-halo {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 30%, #8b5cf6 70%, #ec4899 100%);
    filter: blur(18px);
    opacity: 0.65;
    animation: avatarHaloPulse 5s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes avatarHaloPulse {
    0% { transform: scale(0.95) rotate(0deg); opacity: 0.5; }
    50% { transform: scale(1.05) rotate(180deg); opacity: 0.85; }
    100% { transform: scale(0.95) rotate(360deg); opacity: 0.5; }
  }

  /* 2. Concentric Chromatic Gradient Ring */
  .avatar-chromatic-ring {
    background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 35%, #a855f7 70%, #ec4899 100%);
    background-size: 200% 200%;
    animation: avatarChromaticSheen 6s linear infinite;
    padding: 2.5px;
    box-shadow: 
      0 15px 35px -5px rgba(0, 0, 0, 0.45),
      0 0 25px rgba(56, 189, 248, 0.25),
      inset 0 1px 2px rgba(255, 255, 255, 0.5);
    transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes avatarChromaticSheen {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .avatar-master-wrapper:hover .avatar-chromatic-ring {
    transform: scale(1.03);
    box-shadow: 
      0 20px 45px -5px rgba(56, 189, 248, 0.45),
      0 0 35px rgba(168, 85, 247, 0.4),
      inset 0 1px 3px rgba(255, 255, 255, 0.7);
  }

  /* 3. Floating Verified Seal Badge */
  .avatar-verified-seal {
    background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
    border: 2.5px solid #0f172a;
    box-shadow: 0 4px 15px rgba(6, 182, 212, 0.6);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .avatar-master-wrapper:hover .avatar-verified-seal {
    transform: scale(1.15) rotate(6deg);
    box-shadow: 0 6px 20px rgba(6, 182, 212, 0.8);
  }
</style>

async function submitAnonymousMessage(e, username) {
  e.preventDefault();
  const input = document.getElementById('nglMessageInput');
  const btn = document.getElementById('btnSubmitNgl');
  const formBox = document.getElementById('nglFormBox');

  if (!input || !username) return;
  const msg = input.value.trim();
  if (!msg) return;

  btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-xs"></i> <span>Menerbangkan Pesan...</span>';
  btn.disabled = true;

  try {
    const payload = new URLSearchParams();
    payload.append('action', 'send_ngl_message');
    payload.append('guestUsername', username);
    payload.append('messageText', msg);

    const response = await fetch(SCRIPT_URL, { method: 'POST', body: payload });
    const res = await response.json();

    if (res.status === 'success') {
      // Tampilkan Animasi Sukses Berkilau
      if (formBox) {
        formBox.innerHTML = `

    // -> SMART DEEP-LINKING & AFFILIATE TRACKING ENGINE
    function handleAffiliateClick(e, userId, itemId, platform, originalUrl) {
      e.preventDefault(); // Hentikan perpindahan halaman biasa
      
      // 1. Kirim Log Analytics secara senyap via Image Beacon
      try {
        const device = encodeURIComponent(navigator.userAgent.substring(0, 100));
        const trackingUrl = `${SCRIPT_URL}?action=log_affiliate_click&userId=${userId}&itemId=${itemId}&platform=${platform}&ip=127.0.0.1&device=${device}`;
        new Image().src = trackingUrl;
      } catch (err) { console.error("Tracking Error:", err); }

      // 2. Logika Deteksi Perangkat (Mobile vs Desktop)
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      // 3. Eksekusi Deep-Linking
      if (isMobile) {
        let appIntentUrl = originalUrl;
        
        // Coba konversi skema URL untuk membuka aplikasi native
        if (platform === 'Shopee') {
          appIntentUrl = originalUrl.replace(/^https?:\/\//i, 'shopeeid://');
        } else if (platform === 'Tokopedia') {
          appIntentUrl = originalUrl.replace(/^https?:\/\//i, 'tokopedia://');
        } else if (platform === 'TikTok_Shop') {
          appIntentUrl = originalUrl.replace(/^https?:\/\//i, 'snssdk1180://');
        }
        
        // Coba buka aplikasi bawaan
        window.location.href = appIntentUrl;
        
        // Fallback: Jika aplikasi tidak terinstal, buka di browser setelah 2 detik
        setTimeout(() => {
          window.location.href = originalUrl;
        }, 2000);
      } else {
        // Jika dibuka dari Laptop/Desktop, langsung buka di tab baru
        window.open(originalUrl, '_blank');
      }
    }
    // -> DEEP CONTENT TRACKING ENGINE (IMAGE BEACON)
    function trackContentEvent(userId, contentId, eventType) {
      try {
        const device = encodeURIComponent(navigator.userAgent.substring(0, 100));
        // URL Format: log_content_event (sesuai backend router)
        const trackingUrl = `${SCRIPT_URL}?action=log_content_event&userId=${userId}&contentId=${contentId}&eventType=${eventType}&ip=127.0.0.1&device=${device}`;
        const beacon = new Image();
        beacon.src = trackingUrl;
        console.log(`[Analytics] Tracked ${eventType} for Content: ${contentId}`);
      } catch (e) { console.error("Tracking Error:", e); }
    }
    function startPublicBannerSlider() {
      if (publicBannerInterval) clearInterval(publicBannerInterval);
      
      const slides = document.querySelectorAll('.public-top-slide');
      if (slides.length <= 1) {
        if (slides.length === 1) {
          slides[0].style.opacity = '1';
          slides[0].style.zIndex = '10';
        }
        return;
      }
      
      let currentIndex = 0;
      slides[currentIndex].style.opacity = '1';
      slides[currentIndex].style.zIndex = '10';
      
      publicBannerInterval = setInterval(() => {
        slides[currentIndex].style.opacity = '0';
        slides[currentIndex].style.zIndex = '1';
        
        currentIndex = (currentIndex + 1) % slides.length;
        
        slides[currentIndex].style.opacity = '1';
        slides[currentIndex].style.zIndex = '10';
      }, 4000); // Berputar otomatis setiap 4 detik
    }

// 1. FUNGSI PENCARIAN TAUTAN REAL-TIME DI HALAMAN PUBLIK
function filterLinks(query) {
  const cleanQuery = (query || '').toLowerCase().trim();
  const cards = document.querySelectorAll('#linksContainer > a');
  
  cards.forEach(card => {
    const title = card.querySelector('h4') ? card.querySelector('h4').textContent.toLowerCase() : '';
    const desc = card.querySelector('p') ? card.querySelector('p').textContent.toLowerCase() : '';
    
    if (title.includes(cleanQuery) || desc.includes(cleanQuery)) {
      card.style.display = 'flex';
    } else {
      card.style.display = 'none';
    }
  });
}

    function timeAgo(dateString) {
      if (!dateString) return 'Baru saja';
      const date = new Date(dateString);
      const now = new Date();
      const seconds = Math.floor((now - date) / 1000);

      if (seconds < 60) return 'Baru saja';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes} menit yang lalu`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours} jam yang lalu`;
      const days = Math.floor(hours / 24);
      if (days < 30) return `${days} hari yang lalu`;
      const months = Math.floor(days / 30);
      if (months < 12) return `${months} bulan yang lalu`;
      return `${Math.floor(months / 12)} tahun yang lalu`;
    }

    // 2. Helper Pelacak Analitik Konten (trackContentEvent)
    function trackContentEvent(userId, contentId, eventType) {
      try {
        const device = encodeURIComponent(navigator.userAgent.substring(0, 100));
        const trackingUrl = `${SCRIPT_URL}?action=log_content_event&userId=${userId}&contentId=${contentId}&eventType=${eventType}&ip=127.0.0.1&device=${device}`;
        const beacon = new Image();
        beacon.src = trackingUrl;
        console.log(`[Analytics] Tracked ${eventType} for Content: ${contentId}`);
      } catch (e) { 
        console.error("Tracking Error:", e); 
      }
    }
   
    // -> FUNGSI UNTUK MENCATAT KLIK SECARA SENYAP (DENGAN DEBUGLOG)
  // -> FUNGSI PENCATAT KLIK DENGAN TEKNIK IMAGE PIXEL TRACKING (100% ANTI-CORS)
   // -> FUNGSI PELACAK KLIK (METODE IMAGE BEACON - 100% AMAN & ANTI BLOKIR)
    function recordClick(userId, blockId) {
      try {
        const device = encodeURIComponent(navigator.userAgent.substring(0, 100));
        const ref = encodeURIComponent(document.referrer || 'Direct');
        
        // Membangun URL GET Request
        const trackingUrl = `${SCRIPT_URL}?action=log_click&userId=${userId}&blockId=${blockId}&device=${device}&referrer=${ref}`;
        
        // Metode Image Beacon: Membuat elemen gambar maya di latar belakang.
        // Browser TIDAK BISA membatalkan pemuatan gambar, sehingga log dijamin sampai ke server Google.
        const beacon = new Image();
        beacon.src = trackingUrl;
        
        console.log("Klik terdeteksi! Mengirim Beacon ke:", trackingUrl);
      } catch (e) {
        console.error("Gagal meluncurkan beacon analitik.", e);
      }
    }

    function playInlineMedia(contentId, embedUrl, userId) {
  // Lapis 2 Analitik: Catat Pemutaran (Play Event Tracking)
  trackContentEvent(userId, contentId, 'Play');

  const container = document.getElementById(`mediaContainer_${contentId}`);
  if (!container) return;

  if (!embedUrl) {
    // Jika platform tidak mendukung inline iframe (misal TikTok/Reels app-only), buka di tab baru
    const content = (STATE && STATE.creatorContents) ? STATE.creatorContents.find(c => c.Content_ID === contentId) : null;
    if (content && content.Media_URL) {
      window.open(content.Media_URL, '_blank');
    }
    return;
  }

  // Ganti Thumbnail dengan Iframe Pemutar Video / Audio HD
  container.innerHTML = `
    <iframe 
      src="${embedUrl}" 
      class="w-full h-full border-0 absolute inset-0 rounded-[22px] bg-black shadow-inner" 
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen" 
      allowfullscreen
    ></iframe>
  `;
}

    function loadGoogleFont(fontName) {
      if (!fontName) return;
      const id = 'gf-' + fontName.replace(/\s+/g, '-').toLowerCase();
      if (!document.getElementById(id)) {
        const link = document.createElement('link');
        link.id = id;
        link.rel = 'stylesheet';
        link.href = `https://fonts.googleapis.com/css2?family=${fontName.replace(/\s+/g, '+')}:wght@400;500;600;700;800&display=swap`;
        document.head.appendChild(link);
      }
    }

    function isColorDark(colorVal) {
      if (!colorVal) return false;
      let hex = colorVal;
      if (colorVal.includes('linear-gradient')) {
        const match = colorVal.match(/#([a-fA-F0-9]{6}|[a-fA-F0-9]{3})/);
        if (match) hex = match[0];
      }
      hex = hex.replace('#', '');
      const r = parseInt(hex.substr(0, 2), 16);
      const g = parseInt(hex.substr(2, 2), 16);
      const b = parseInt(hex.substr(4, 2), 16);
      const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
      return (yiq < 128);
    }
    function escapeHtml(val) {
      return String(val || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
    function showErrorPage(message) {

          <p class="text-sm text-slate-400 mt-2">${message}</p>
        </div>
      `;
    }
