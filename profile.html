<!-- CUSTOM LUXURY AVATAR STYLING & ANIMATIONS -->
<style>
  /* 1. Ambient Breathing Plasma Halo */
  .avatar-luminous-halo {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 30%, #8b5cf6 70%, #ec4899 100%);
    filter: blur(18px);
    opacity: 0.65;
    animation: avatarHaloPulse 5s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes avatarHaloPulse {
    0% { transform: scale(0.95) rotate(0deg); opacity: 0.5; }
    50% { transform: scale(1.05) rotate(180deg); opacity: 0.85; }
    100% { transform: scale(0.95) rotate(360deg); opacity: 0.5; }
  }

  /* 2. Concentric Chromatic Gradient Ring */
  .avatar-chromatic-ring {
    background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 35%, #a855f7 70%, #ec4899 100%);
    background-size: 200% 200%;
    animation: avatarChromaticSheen 6s linear infinite;
    padding: 2.5px;
    box-shadow: 
      0 15px 35px -5px rgba(0, 0, 0, 0.45),
      0 0 25px rgba(56, 189, 248, 0.25),
      inset 0 1px 2px rgba(255, 255, 255, 0.5);
    transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes avatarChromaticSheen {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .avatar-master-wrapper:hover .avatar-chromatic-ring {
    transform: scale(1.03);
    box-shadow: 
      0 20px 45px -5px rgba(56, 189, 248, 0.45),
      0 0 35px rgba(168, 85, 247, 0.4),
      inset 0 1px 3px rgba(255, 255, 255, 0.7);
  }

  /* 3. Floating Verified Seal Badge */
  .avatar-verified-seal {
    background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
    border: 2.5px solid #0f172a;
    box-shadow: 0 4px 15px rgba(6, 182, 212, 0.6);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .avatar-master-wrapper:hover .avatar-verified-seal {
    transform: scale(1.15) rotate(6deg);
    box-shadow: 0 6px 20px rgba(6, 182, 212, 0.8);
  }
</style>

  if (hiddenId) hiddenId.value = communityId;
  if (modalName) modalName.textContent = communityName;
  
  const modal = document.getElementById('communityJoinModal');
  const backdrop = document.getElementById('comModalBackdrop');
  const box = document.getElementById('comModalBox');
  
  if (!modal || !backdrop || !box) return;

  modal.classList.remove('hidden');
  modal.classList.add('flex');
  
  setTimeout(() => {
    backdrop.classList.remove('opacity-0');
    backdrop.classList.add('opacity-100');
    box.classList.remove('scale-95', 'opacity-0');
    box.classList.add('scale-100', 'opacity-100');
  }, 40);

function closeCommunityModal() {
  const modal = document.getElementById('communityJoinModal');
  const backdrop = document.getElementById('comModalBackdrop');
  const box = document.getElementById('comModalBox');
  
  if (!modal || !backdrop || !box) return;

  backdrop.classList.remove('opacity-100');
  backdrop.classList.add('opacity-0');
  box.classList.remove('scale-100', 'opacity-100');
  box.classList.add('scale-95', 'opacity-0');
  
  setTimeout(() => {
    modal.classList.add('hidden');

  btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-xs"></i> <span>Menerbangkan Pesan...</span>';

  try {
    const payload = new URLSearchParams();
    payload.append('action', 'send_ngl_message');
    payload.append('guestUsername', username);
    payload.append('messageText', msg);

    const response = await fetch(SCRIPT_URL, { method: 'POST', body: payload });

  const btnRate = document.getElementById('pubTabRateCard');
  const btnCommunity = document.getElementById('pubTabCommunity');
  const btnNgl = document.getElementById('pubTabNgl');

  const allSections = [mainContent, contentSection, affiliateSection, rateSection, nglSection, communitySection];
  const allButtons = [btnLinks, btnContent, btnAffiliate, btnRate, btnCommunity, btnNgl];

  // 1. Sembunyikan Seluruh Konten Tab dengan Aman
  allSections.forEach(el => {
    if (el) {
      el.classList.add('hidden');
      el.classList.remove('flex');
    }
  });

  // 2. Reset Status Aktif Seluruh Tombol Tab
  allButtons.forEach(btn => {
    if (btn) btn.classList.remove('active');
  });

  // 3. Tentukan Tab yang Dituju
  let activeTargetSection = null;
  let activeTargetBtn = null;

  if (tab === 'links') {
    activeTargetSection = mainContent;
    activeTargetBtn = btnLinks;
  } else if (tab === 'content') {
    activeTargetSection = contentSection;
    activeTargetBtn = btnContent;
  } else if (tab === 'affiliate') {
    activeTargetSection = affiliateSection;
    activeTargetBtn = btnAffiliate;
  } else if (tab === 'ratecard') {
    activeTargetSection = rateSection;
    activeTargetBtn = btnRate;
  } else if (tab === 'community') {
    activeTargetSection = communitySection;
    activeTargetBtn = btnCommunity;
  } else if (tab === 'ngl') {
    activeTargetSection = nglSection;
    activeTargetBtn = btnNgl;
  }

  // 4. Munculkan Section yang Dipilih
  if (activeTargetSection) {
    activeTargetSection.classList.remove('hidden');
    activeTargetSection.classList.add('flex');

  // 5. Beri Efek Kaca Aktif & Gulir Otomatis ke Tengah Layar Mobile
  if (activeTargetBtn) {
    activeTargetBtn.classList.add('active');
    if (typeof activeTargetBtn.scrollIntoView === 'function') {

// 2. SMART DEEP-LINKING & AFFILIATE TRACKING ENGINE (APP INTENT TRIGGER)
function handleAffiliateClick(e, userId, itemId, platform, originalUrl) {
  e.preventDefault();

  // 1. Catat Log Klik secara Senyap via Image Beacon
  try {
    const device = encodeURIComponent(navigator.userAgent.substring(0, 100));
    const trackingUrl = `${SCRIPT_URL}?action=log_affiliate_click&userId=${userId}&itemId=${itemId}&platform=${platform}&ip=127.0.0.1&device=${device}`;
    new Image().src = trackingUrl;
  } catch (err) {
    console.error("Tracking Error:", err);
  }

  // 2. Deteksi Perangkat (Mobile vs Desktop)
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

  // 3. Eksekusi Skema Deep-Linking Aplikasi Asli
  if (isMobile) {
    let appIntentUrl = originalUrl;

    // Konversi protokol URL untuk membuka aplikasi native
    if (platform === 'Shopee') {
      appIntentUrl = originalUrl.replace(/^https?:\/\//i, 'shopeeid://');
    } else if (platform === 'Tokopedia') {
      appIntentUrl = originalUrl.replace(/^https?:\/\//i, 'tokopedia://');
    } else if (platform === 'TikTok_Shop') {
      appIntentUrl = originalUrl.replace(/^https?:\/\//i, 'snssdk1180://');
    }

    window.location.href = appIntentUrl;

    // Fallback: Jika aplikasi tidak terpasang di HP, buka melalui browser dalam 2 detik
    setTimeout(() => {
      window.location.href = originalUrl;
    }, 2000);
  } else {
    // Jika dibuka melalui Desktop/Laptop, langsung buka tab baru
    window.open(originalUrl, '_blank');
  }
}

    function startPublicBannerSlider() {
      if (publicBannerInterval) clearInterval(publicBannerInterval);
      
      const slides = document.querySelectorAll('.public-top-slide');
      if (slides.length <= 1) {
        if (slides.length === 1) {
          slides[0].style.opacity = '1';
          slides[0].style.zIndex = '10';
        }
        return;
      }
      
      let currentIndex = 0;
      slides[currentIndex].style.opacity = '1';
      slides[currentIndex].style.zIndex = '10';
      
      publicBannerInterval = setInterval(() => {
        slides[currentIndex].style.opacity = '0';
        slides[currentIndex].style.zIndex = '1';
        
        currentIndex = (currentIndex + 1) % slides.length;
        
        slides[currentIndex].style.opacity = '1';
        slides[currentIndex].style.zIndex = '10';
      }, 4000); // Berputar otomatis setiap 4 detik
    }

function filterLinks(query) {
  const cleanQuery = (query || '').toLowerCase().trim();
  const cards = document.querySelectorAll('#linksContainer > a');
  
  cards.forEach(card => {
    const title = card.querySelector('h4') ? card.querySelector('h4').textContent.toLowerCase() : '';
    const desc = card.querySelector('p') ? card.querySelector('p').textContent.toLowerCase() : '';
    
    if (title.includes(cleanQuery) || desc.includes(cleanQuery)) {
      card.style.display = 'flex';
    } else {
      card.style.display = 'none';
    }
  });
}

function timeAgo(dateString) {
      if (!dateString) return 'Baru saja';
      const date = new Date(dateString);
      const now = new Date();
      const seconds = Math.floor((now - date) / 1000);

      if (seconds < 60) return 'Baru saja';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes} menit yang lalu`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours} jam yang lalu`;
      const days = Math.floor(hours / 24);
      if (days < 30) return `${days} hari yang lalu`;
      const months = Math.floor(days / 30);
      if (months < 12) return `${months} bulan yang lalu`;
      return `${Math.floor(months / 12)} tahun yang lalu`;
    }

function formatFollowersNumber(val) {
  if (!val) return '0';
  const cleanStr = String(val).trim();
  // Jika pengguna sudah mengetik huruf seperti "150K" atau "2.5M", pertahankan formatnya
  if (/[a-zA-Z]/i.test(cleanStr)) {
    return cleanStr.toUpperCase();
  }
  // Format angka murni ke format ribuan titik (.) Indonesia
  const num = Number(cleanStr.replace(/[^0-9]/g, ''));
  if (isNaN(num) || num === 0) return cleanStr;
  return new Intl.NumberFormat('id-ID').format(num);
}

    if (!val) return fallback;
    let str = String(val).trim();
    if (str.endsWith('%')) return str;
    let num = parseFloat(str);
    if (!isNaN(num)) {
      return (num <= 1 ? Math.round(num * 100) : Math.round(num)) + '%';
    }
    return fallback;
  };

  const femalePercent = cleanPercent(stats.Gender_Female, '50%');
  const malePercent = cleanPercent(stats.Gender_Male, '50%');
  
  // Format Angka Engagement Rate
  let erText = String(stats.Engagement_Rate || '0%').trim();
  if (!erText.endsWith('%') && !isNaN(parseFloat(erText))) {
    let num = parseFloat(erText);
    erText = (num <= 1 && num > 0 ? (num * 100).toFixed(1) : num) + '%';
  }

  // =========================================================================
  // 1. KARTU DEMOGRAFI KACA TEMBUS PANDANG (FROSTED GLASS CHAMBER)
  // =========================================================================
  const statsBox = document.createElement('div');
  statsBox.className = "luxury-glass-rate-card w-full p-5 sm:p-6 rounded-[32px] space-y-5 relative overflow-hidden";

  statsBox.innerHTML = `
    <!-- Header Demografi -->
    <div class="flex items-center justify-between pb-3.5 border-b border-white/10">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-white/10 border border-white/15 backdrop-blur-md text-purple-300 flex items-center justify-center text-base shadow-inner">
          <i class="fa-solid fa-chart-pie"></i>
        </div>
        <div class="text-left">
          <h4 class="font-black text-sm sm:text-base tracking-tight leading-none text-white drop-shadow-sm">Demografi & Wawasan Audiens</h4>
          <p class="text-[11px] text-purple-300/90 font-bold mt-1">Laporan Resmi Jangkauan Media Sosial</p>
        </div>
      </div>

      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/10 border border-white/20 text-purple-200 font-extrabold text-[9.5px] uppercase tracking-wider shrink-0 backdrop-blur-md">
        ${escapeHtml(stats.Platform || 'All Platforms')}
      </span>
    </div>

    <!-- Grid 2 Metrik KPI Kaca (Total Pengikut Berformat Titik & Engagement Rate) -->
    <div class="grid grid-cols-2 gap-3 text-center">
      <div class="ratecard-kpi-glass p-4 rounded-2xl">
        <p class="text-[9px] font-black uppercase tracking-widest text-slate-300">Total Pengikut</p>
        <p class="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-violet-200 via-purple-100 to-white mt-1 drop-shadow">
          ${formatFollowersNumber(stats.Followers)}
        </p>
      </div>
      <div class="ratecard-kpi-glass p-4 rounded-2xl">
        <p class="text-[9px] font-black uppercase tracking-widest text-slate-300">Engagement Rate</p>
        <p class="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-300 via-rose-200 to-white mt-1 drop-shadow">
          ${escapeHtml(erText)}
        </p>
      </div>
    </div>

    <!-- Dual-Tone Gender Ratio Visual Bar -->
    <div class="space-y-2 pt-1">
      <div class="flex justify-between text-xs font-bold">
        <span class="text-pink-300 flex items-center gap-1.5 drop-shadow"><i class="fa-solid fa-venus"></i> Wanita ${femalePercent}</span>
        <span class="text-cyan-300 flex items-center gap-1.5 drop-shadow">Pria ${malePercent} <i class="fa-solid fa-mars"></i></span>
      </div>
      <div class="ratecard-gender-glass w-full h-3 rounded-full overflow-hidden flex p-0.5">
        <div class="h-full bg-gradient-to-r from-pink-500 to-rose-500 rounded-full transition-all duration-700 shadow-md" style="width: ${femalePercent}"></div>
      </div>
    </div>

    <!-- Rincian Kelompok Usia & Lokasi Geografis -->
    <div class="flex items-center justify-between text-xs font-bold pt-3.5 border-t border-white/10 gap-2 flex-wrap text-left">
      <span class="flex items-center gap-1.5 text-white/90">
        <i class="fa-solid fa-users text-xs text-violet-300"></i>
        <span>Usia: <strong class="text-violet-300">${escapeHtml(stats.Top_Age_Group || '18 - 24 Tahun')}</strong></span>
      </span>
      <span class="flex items-center gap-1.5 text-white/90">
        <i class="fa-solid fa-location-dot text-xs text-rose-300"></i>
        <span>Domisili: <strong class="text-rose-300">${escapeHtml(stats.Top_Location || 'Indonesia')}</strong></span>
      </span>
    </div>
  `;
  rateContainer.appendChild(statsBox);

  // =========================================================================
  // 2. HEADER PEMBAGI PAKET KOLABORASI (GLASS PILL)
  // =========================================================================
  if (packages.length > 0) {
    const divider = document.createElement('div');
    divider.className = "flex items-center justify-center gap-3 my-2 w-full px-2";
    divider.innerHTML = `
      <div class="h-px flex-1 bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
      <span class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/10 border border-white/15 text-white font-black text-[10px] uppercase tracking-[0.25em] shadow-sm backdrop-blur-md">
        <i class="fa-solid fa-handshake text-xs text-amber-300"></i> Paket Kolaborasi & Sponsorship
      </span>
      <div class="h-px flex-1 bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
    `;
    rateContainer.appendChild(divider);

    // =========================================================================
    // 3. KARTU PAKET TIER PRICING KACA DENGAN DELIVERABLES CHECKLIST
    // =========================================================================
    packages.forEach(pkg => {
      const card = document.createElement('div');
      card.className = "luxury-glass-rate-card w-full p-5 sm:p-6 rounded-[32px] flex flex-col text-left relative overflow-hidden group";

      // WhatsApp Message Generator
      const waNumber = settings.Social_WhatsApp || '628123456789';
      const waMessage = encodeURIComponent(`Halo Kak ${user.name || ''}, saya tertarik mengajukan kerja sama untuk paket Rate Card: *${pkg.Package_Name}* (${formatRupiahProfile(pkg.Package_Price)}). Mohon informasi ketersediaan jadwal slot dan brief selanjutnya. Terima kasih!`);
      const waLink = `https://wa.me/${waNumber}?text=${waMessage}`;

      // Parsing Rincian Deliverables menjadi Checklist Berbutir Kaca
      const rawDeliverables = pkg.Deliverables || '';
      const items = rawDeliverables.split(/(?:✔|\n|,)/).map(s => s.trim()).filter(s => s.length > 0);
      
      let deliverablesHTML = '';
      if (items.length > 0) {
        deliverablesHTML = `<ul class="space-y-2 mt-4 mb-5">`;
        items.forEach(item => {
          deliverablesHTML += `
            <li class="flex items-start gap-2.5 text-xs font-semibold leading-relaxed text-white/90">
              <span class="w-4 h-4 rounded-full bg-emerald-500/25 text-emerald-300 border border-emerald-400/40 flex items-center justify-center text-[9px] shrink-0 mt-0.5 shadow-sm">
                <i class="fa-solid fa-check"></i>
              </span>
              <span>${escapeHtml(item)}</span>
            </li>
          `;
        });
        deliverablesHTML += `</ul>`;
      } else {
        deliverablesHTML = `<p class="text-xs mt-3 mb-5 leading-relaxed font-medium text-white/80">${escapeHtml(rawDeliverables) || '<span class="text-slate-400 italic">Rincian layanan kustom.</span>'}</p>`;
      }

      card.innerHTML = `
        <!-- Baris Atas: Judul Paket & Badge Harga Hijau Emerald Glow -->
        <div class="flex justify-between items-start gap-3 pb-3.5 border-b border-white/10">
          <div>
            <h4 class="font-black text-base sm:text-lg tracking-tight leading-snug text-white drop-shadow-sm">
              ${escapeHtml(pkg.Package_Name)}
            </h4>
            <div class="flex items-center gap-1.5 text-[11px] font-extrabold text-purple-300 mt-1">
              <i class="fa-solid fa-bolt text-amber-300 text-xs"></i>
              <span>Est. Reach: <strong class="text-white">${escapeHtml(pkg.Est_Reach || 'N/A')}</strong></span>
            </div>
          </div>

          <div class="px-3.5 py-1.5 bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 font-black text-xs sm:text-sm rounded-2xl shadow-inner shrink-0 backdrop-blur-md">
            ${formatRupiahProfile(pkg.Package_Price)}
          </div>
        </div>

        <!-- Rincian Deliverables Bercentang Kaca -->
        ${deliverablesHTML}

        <!-- Tombol WhatsApp Direct Sponsorship Proposal Berkilau -->
        <a 
          href="${waLink}" 
          target="_blank" 
          onclick="recordClick('${user.id || ''}', '${pkg.Package_ID}')" 
          class="btn-ratecard-glossy w-full py-3.5 rounded-2xl text-white font-extrabold text-xs sm:text-sm uppercase tracking-wider flex items-center justify-center gap-2 cursor-pointer shadow-lg mt-auto"
        >
          <i class="fa-solid fa-handshake text-sm"></i>
          <span>Ajukan Kerja Sama via WhatsApp</span>
        </a>
      `;

      rateContainer.appendChild(card);
    });
  }
}
function isColorDark(colorVal) {
      if (!colorVal) return false;
      let hex = colorVal;
      if (colorVal.includes('linear-gradient')) {
        const match = colorVal.match(/#([a-fA-F0-9]{6}|[a-fA-F0-9]{3})/);
        if (match) hex = match[0];
      }
      hex = hex.replace('#', '');
      const r = parseInt(hex.substr(0, 2), 16);
      const g = parseInt(hex.substr(2, 2), 16);
      const b = parseInt(hex.substr(4, 2), 16);
      const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
      return (yiq < 128);
    }
    function escapeHtml(val) {
      return String(val || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
    function showErrorPage(message) {
      document.getElementById('profileLoader').style.display = 'none';
      document.body.innerHTML = `
        <div class="min-h-screen flex flex-col items-center justify-center text-center p-6">
          <i class="fa-solid fa-triangle-exclamation text-red-500 text-5xl mb-4"></i>
          <h1 class="text-xl font-bold text-white">Profil Tidak Ditemukan</h1>
          <p class="text-sm text-slate-400 mt-2">${message}</p>
        </div>
      `;
    }
  </script>
</body>
</html>
